<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101826">
<meta name="description" content="Rock 'n' Roller III: World Tour. A granite boulder goes on a world tour, rolling through London, Paris, Venice, the Alps, Spain, Egypt, Tokyo, Rio, Sydney and New York, smashing the annoying people in the way.">
<title>Rock 'n' Roller III: World Tour (reels)</title>
<link rel="icon" href="./favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/src/styles.css">
<link rel="stylesheet" href="/src/reel/reel.css">
<style>
  /* No game banner under the opening line. */
  body.hooked #banner { visibility: hidden; }

  /* The title's logo on the card (the game scopes its size to the title screen). */
  #card .logo .top { font-size: 46px; white-space: nowrap; }
  #card .logo .bottom { font-size: 46px; white-space: nowrap; }
  #card .logo .tag { font-size: 13px; letter-spacing: 0.3em; }
  #card .logo .presents { font-size: 11px; letter-spacing: 0.3em; }

  /* The phone layout's own overlaps, on film: the snow globes ran under the hype, and Rock's line under the PAUSE and SOUND buttons. */
  .carried { right: auto; left: 18px; top: 66px; max-width: 150px; flex-wrap: wrap; gap: 2px 12px; }
  #say { bottom: 176px; }
</style>
</head>
<body>
<div id="view"></div>
<div id="vignette" aria-hidden="true"></div>
<div id="strobe" aria-hidden="true"></div>
<div id="ui"></div>
<pre id="error" hidden></pre>
<script type="module" src="/src/reel/recorder.js"></script>
</body>
</html>
